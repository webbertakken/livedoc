name: Next build cache, save
description: >-
  Saves Turbopack's build cache restored by next-cache-restore in the same job, on main only: pull
  requests read main's cache but never write their own, so they cannot evict it from the
  repository's cache storage.

runs:
  using: composite
  steps:
    - name: Save Next build cache
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ env.NEXT_CACHE_PATHS }}
        key: ${{ env.NEXT_CACHE_KEY }}
