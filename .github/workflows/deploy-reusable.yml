name: Deploy (reusable)

# The deploy itself, for ONE environment. NOT triggerable on its own — it has
# no `workflow_dispatch`, so the Actions tab lists it with no Run button.
# `deploy.yml` (production, manual) calls it; every environment it deploys runs
# the same steps, differing only in this workflow's inputs and the secrets the
# caller hands over.
#
# Builds each app, then deploys to Cloudflare Workers in dependency order:
# marketing + live + telemetry + help + api in parallel → mcp (when asked
# for) through a service binding to api → router last (service bindings to the
# five path-routed workers).
on:
  workflow_call:
    inputs:
      wrangler_env:
        description: >-
          Wrangler environment name. Empty deploys the top-level config
          (production); a name deploys that `[env.<name>]` block, with the
          hosted profile's environment of the same name.
        type: string
        default: ''
      environment_name:
        description: GitHub environment recorded against the deployment.
        type: string
        required: true
      environment_url:
        description: Public URL the deployment is reachable at.
        type: string
        required: true
      ref:
        description: >-
          Commit to check out. Empty means the default branch. A
          `workflow_run` caller passes the exact SHA CI went green on, because
          it otherwise checks out whatever `main` has moved to since.
        type: string
        default: ''
      mcp_origin:
        description: >-
          Baked into the live build as NEXT_PUBLIC_MCP_ORIGIN. Empty falls
          back to the live app's built-in default (see
          apps/live/lib/mcp-config.ts).
        type: string
        default: ''
      deploy_mcp:
        description: >-
          Deploy the MCP worker. Its consent page needs sign-in, so it is
          off until the environment has sign-in configured.
        type: boolean
        default: false
    secrets:
      CF_API_TOKEN:
        required: true
      CF_ACCOUNT_ID:
        required: true
      # Each optional secret below is skipped when unset, so a fork that sets
      # none still deploys. The caller decides WHICH value it passes, so this
      # workflow never has to know which environment it is running for.
      # Sign-in (docs/specs/014-identity/auth-and-guest-access.md): the api worker's better-auth secret, which also
      # derives the guest signing key, and the Google sign-in client's secret.
      BETTER_AUTH_SECRET:
        required: false
      GOOGLE_AUTH_CLIENT_SECRET:
        required: false
      INTERNAL_EVENTS_KEY:
        required: false
      # The Google Picker's browser key for the Drive mirror
      # (docs/specs/022-drive-mirror/drive-mirror.md): one per Google Cloud
      # project, so one per environment, like the sign-in secrets above.
      NEXT_PUBLIC_GOOGLE_API_KEY:
        required: false

# The hosted profile (docs/specs/016-platform/deployment.md "Hosted profile"):
# docs.nu's own deploys add the vars in apps/api/hosted-vars.json (telemetry
# on, per-owner image caps, its public origin) and a fork's do not, so a fork
# deploying this repo as documented is telemetry-off and uncapped. Keyed on the
# repository ID of webbertakken/livedoc rather than its name, so a rename or a
# transfer keeps the profile and no fork can match it. In a reusable workflow
# the `github` context is the caller's, so every caller resolves it the same way.
env:
  HOSTED: ${{ github.repository_id == '1367277963' }}

# Least privilege: deploys authenticate to Cloudflare with CF_API_TOKEN, which
# is a secret rather than a token permission, so no job here needs write access
# to the repository itself.
permissions:
  contents: read

jobs:
  build:
    name: Build apps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The live build id (docs/specs/016-platform/stale-builds.md): the commit this run builds, baked
    # into the editor and handed to the api deploy, so both name the same build.
    outputs:
      build_id: ${{ steps.build-id.outputs.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # Full history, without file contents: the help sitemap dates each article by its last
          # commit (apps/help/lib/article-dates.ts). Commits and trees only, about 8 MB and 2 s;
          # a shallow clone would date every article to this one commit, so the sitemap omits
          # dates when it finds one.
          fetch-depth: 0
          filter: blob:none

      - name: Record the build id
        id: build-id
        run: echo "id=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The hosted profile's build-time half: NEXT_PUBLIC_TELEMETRY_ENABLED,
      # mirrored from hosted-vars.json so the frontends emit exactly when the api
      # ingests. Skipped on a fork, whose frontends then emit nothing unless its
      # own build env opts in.
      #
      # Per environment where the profile says so: the Drive mirror's Google
      # client id is each environment's own
      # (docs/specs/022-drive-mirror/drive-mirror.md, "Hosted deployment").
      - name: Apply hosted profile to the build
        if: env.HOSTED == 'true'
        working-directory: apps/api
        env:
          WRANGLER_ENV: ${{ inputs.wrangler_env }}
        run: |
          set -euo pipefail
          node scripts/hosted-vars.mjs build-env ${WRANGLER_ENV:+--env "$WRANGLER_ENV"} >> "$GITHUB_ENV"

      - name: Build all apps
        # Sign-in needs no build-time key: the live app reads it from the api's
        # /api/capabilities at runtime (docs/specs/014-identity/auth-and-guest-access.md).
        env:
          # Which MCP host the live app points at, so an OAuth flow stays
          # inside its own environment.
          NEXT_PUBLIC_MCP_ORIGIN: ${{ inputs.mcp_origin }}
          # This environment's key, handed over by the caller as the
          # NEXT_PUBLIC_GOOGLE_API_KEY secret.
          # The Google Picker's browser API key for the Drive mirror's "Show this
          # folder to livedoc" (docs/specs/022-drive-mirror/drive-mirror.md). Publishable
          # (restrict it by HTTP referrer in the Cloud Console); unset leaves the
          # mirror working and the folder adoption button hidden.
          NEXT_PUBLIC_GOOGLE_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_API_KEY }}
          # The live build id, matched by the api's BUILD_ID (docs/specs/016-platform/stale-builds.md).
          NEXT_PUBLIC_BUILD_ID: ${{ steps.build-id.outputs.id }}
        run: pnpm build

      # The live build must carry this environment's Google client id and no
      # other environment's, so it always agrees with the api worker the same
      # profile entry configures (the api side is checked after its deploy).
      - name: Verify the live build's hosted Google client id
        if: env.HOSTED == 'true'
        working-directory: apps/api
        env:
          WRANGLER_ENV: ${{ inputs.wrangler_env }}
        run: node scripts/hosted-vars.mjs verify-build ../live/out ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

      - name: Upload marketing build
        uses: actions/upload-artifact@v7
        with:
          name: marketing-out
          path: apps/marketing/out
          retention-days: 1

      - name: Upload live build
        uses: actions/upload-artifact@v7
        with:
          name: live-out
          path: apps/live/out
          retention-days: 1

      - name: Upload telemetry build
        uses: actions/upload-artifact@v7
        with:
          name: telemetry-out
          path: apps/telemetry/out
          retention-days: 1

      - name: Upload help build
        uses: actions/upload-artifact@v7
        with:
          name: help-out
          path: apps/help/out
          retention-days: 1

  deploy-marketing:
    name: Deploy marketing
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # `${WRANGLER_ENV:+--env "$WRANGLER_ENV"}` below expands to nothing when
      # this is empty, so production runs the exact command it always ran.
      WRANGLER_ENV: ${{ inputs.wrangler_env }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: marketing-out
          path: apps/marketing/out

      - name: Deploy to Cloudflare Workers
        working-directory: apps/marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

  deploy-telemetry:
    name: Deploy telemetry
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_ENV: ${{ inputs.wrangler_env }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: telemetry-out
          path: apps/telemetry/out

      - name: Deploy to Cloudflare Workers
        working-directory: apps/telemetry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

  deploy-help:
    name: Deploy help
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_ENV: ${{ inputs.wrangler_env }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: help-out
          path: apps/help/out

      - name: Deploy to Cloudflare Workers
        working-directory: apps/help
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

  deploy-live:
    name: Deploy live
    # After the api, so a new editor never calls an api that lacks its routes
    # (docs/specs/016-platform/deployment.md, "Renaming migrations").
    needs: [build, deploy-api]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_ENV: ${{ inputs.wrangler_env }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: live-out
          path: apps/live/out

      - name: Deploy to Cloudflare Workers
        working-directory: apps/live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

  deploy-api:
    name: Deploy api
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The `secrets` context can't be read inside a step `if:`
    # (GitHub only allows env/github/needs/vars there), so lift each
    # secret into a job-level env var. The "Sync" steps below then gate
    # on `env.<NAME>` instead of the secret directly. An empty/unset
    # secret yields an empty env var, which the `if:` treats as "skip".
    env:
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      GOOGLE_AUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_AUTH_CLIENT_SECRET }}
      INTERNAL_EVENTS_KEY: ${{ secrets.INTERNAL_EVENTS_KEY }}
      WRANGLER_ENV: ${{ inputs.wrangler_env }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `whoami` prints which Cloudflare account the API token sees,
      # so when migrations fail with a 7403 "account not authorized"
      # the log shows immediately whether (a) the token doesn't have
      # D1 Edit scope, or (b) the token belongs to a different
      # account than CF_ACCOUNT_ID. Without this the error is too
      # generic to act on.
      - name: Verify Cloudflare token
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: pnpm exec wrangler whoami || true

      # Push the sign-in secret (docs/specs/014-identity/auth-and-guest-access.md) as a worker secret.
      # Repo secret because it must never be in wrangler.toml. `wrangler secret put` overwrites if
      # the secret already exists, so this step is idempotent: rotating is editing the GitHub secret
      # and re-running deploy. It also derives the guest signing key, so with it set the api signs and
      # requires guest signatures. Unset, the step skips and leaves the worker's value as it is; a
      # worker that never had one runs guest-only.
      #
      # Worker secrets are per-environment, so another environment's
      # copy of this value never collides with production's.
      - name: Sync BETTER_AUTH_SECRET secret
        if: ${{ env.BETTER_AUTH_SECRET != '' }}
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          printf '%s' "$BETTER_AUTH_SECRET" \
            | pnpm exec wrangler secret put BETTER_AUTH_SECRET ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

      # Google sign-in's client secret; the client id is a plain var in apps/api/hosted-vars.json.
      # Google sign-in stays off until both are set.
      - name: Sync GOOGLE_AUTH_CLIENT_SECRET secret
        if: ${{ env.GOOGLE_AUTH_CLIENT_SECRET != '' }}
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          printf '%s' "$GOOGLE_AUTH_CLIENT_SECRET" \
            | pnpm exec wrangler secret put GOOGLE_AUTH_CLIENT_SECRET ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

      # INTERNAL_EVENTS_KEY (docs/specs/017-telemetry/telemetry.md) has to hold the SAME value on the api and
      # mcp workers, and a mismatch is silent — the MCP's telemetry just lands
      # back in the throttled anonymous bucket with no error anywhere. Driving
      # both from one GitHub secret is what makes them agree by construction;
      # provisioning them by hand in two terminals is exactly how they drift.
      # Unset = both steps skip, which leaves whatever is already on the
      # workers (including a pair set by hand) untouched.
      - name: Sync INTERNAL_EVENTS_KEY secret
        if: ${{ env.INTERNAL_EVENTS_KEY != '' }}
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          printf '%s' "$INTERNAL_EVENTS_KEY" \
            | pnpm exec wrangler secret put INTERNAL_EVENTS_KEY ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

      # Runs straight before the deploy, after the secret syncs, so the time the
      # live worker runs against a schema newer than its code is only the deploy
      # itself (docs/specs/016-platform/deployment.md, "Renaming migrations").
      # Apply any pending D1 migrations before the new worker code is
      # deployed. Idempotent: wrangler tracks applied migrations in a
      # bookkeeping table and skips any it's already run. Has to
      # happen BEFORE the worker deploy so the new code doesn't
      # briefly run against a schema it doesn't understand.
      #
      # If a migration's bad, this step will fail and the deploy
      # halts before the worker is updated — that's the desired
      # safety: we'd rather block the deploy than leave this
      # environment's database half-migrated.
      - name: Apply D1 migrations (remote)
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        # Database arg is the binding name (`DB`) — wrangler resolves
        # it via wrangler.toml, and `--env` decides WHICH database that
        # binding points at. Wrangler 4 auto-skips the confirmation
        # prompt in non-interactive CI environments, so no flag is
        # needed (the `--yes` flag from wrangler 3 was removed).
        # If this step fails, the most common cause is the CF_API_TOKEN
        # secret missing the D1: Edit permission on the account that
        # owns the database — but the `Verify Cloudflare token` step
        # above is the authoritative diagnostic.
        run: pnpm exec wrangler d1 migrations apply DB --remote ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

      - name: Deploy to Cloudflare Workers
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          # The build id the editor of this run was built with (docs/specs/016-platform/stale-builds.md).
          BUILD_ID: ${{ needs.build.outputs.build_id }}
        # The D1 binding's `database_id` in wrangler.toml is the id
        # `wrangler d1 create` printed for this environment. Migrations
        # run via `pnpm db:migrate:remote` for ad-hoc local runs; the
        # deploy applies them automatically in the step above.
        #
        # On the hosted repository the hosted profile rides along as `--var`
        # flags. Sent on EVERY deploy, because `wrangler deploy` replaces the
        # worker's plain vars with exactly the ones it declares: a value set
        # once in the dashboard is gone on the next deploy.
        run: |
          set -euo pipefail
          hosted_vars=()
          if [ "$HOSTED" = 'true' ]; then
            flags="$(node scripts/hosted-vars.mjs flags ${WRANGLER_ENV:+--env "$WRANGLER_ENV"})"
            mapfile -t hosted_vars <<<"$flags"
          fi
          pnpm exec wrangler deploy ${WRANGLER_ENV:+--env "$WRANGLER_ENV"} "${hosted_vars[@]}" --var "BUILD_ID:$BUILD_ID"

      # Read the hosted vars back off the version now serving traffic and fail
      # the run if any is missing or different. The image caps are the R2
      # quota guard; they were once documented as live while no deploy set
      # them, and nothing noticed. This is the step that notices.
      - name: Verify hosted vars are live
        if: env.HOSTED == 'true'
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: node scripts/hosted-vars.mjs verify ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

  deploy-mcp:
    name: Deploy mcp
    # The MCP worker has a service binding to the api worker (docs/specs/015-api/mcp-server.md), so api
    # must exist first. Not a router dependency: the MCP server is its own
    # host, not a path under the main hostname. Off unless the caller asks.
    needs: deploy-api
    if: inputs.deploy_mcp
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Lifted to job level for the same reason as deploy-api's: the `secrets`
    # context isn't readable from a step `if:`.
    env:
      INTERNAL_EVENTS_KEY: ${{ secrets.INTERNAL_EVENTS_KEY }}
      WRANGLER_ENV: ${{ inputs.wrangler_env }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The matching half of deploy-api's sync — same GitHub secret, so the two
      # workers can't disagree (docs/specs/017-telemetry/telemetry.md). Skipped when unset, leaving whatever
      # is already on the worker in place.
      - name: Sync INTERNAL_EVENTS_KEY secret
        if: ${{ env.INTERNAL_EVENTS_KEY != '' }}
        working-directory: apps/mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          printf '%s' "$INTERNAL_EVENTS_KEY" \
            | pnpm exec wrangler secret put INTERNAL_EVENTS_KEY ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

      - name: Deploy to Cloudflare Workers
        working-directory: apps/mcp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}

  deploy-router:
    name: Deploy router
    # Router has service bindings to all five path-routed workers, so they
    # must exist before it deploys.
    needs: [deploy-marketing, deploy-live, deploy-api, deploy-telemetry, deploy-help]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The router is what makes the hostname serve the new code, so it is the
    # one job that records the GitHub deployment. Putting it on all eight
    # would file eight deployments per run for one release. No protection
    # rules are implied — an environment with none behaves exactly as before;
    # it just gives the run a "View deployment" link, and somewhere to add an
    # approval gate later without touching this file.
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ inputs.environment_url }}
    env:
      WRANGLER_ENV: ${{ inputs.wrangler_env }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare Workers
        working-directory: apps/router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy ${WRANGLER_ENV:+--env "$WRANGLER_ENV"}
