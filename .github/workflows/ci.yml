name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only checks out and verifies. It never writes
# to the repo, so the default token stays read-only rather than inheriting
# whatever the repository-wide default happens to be. The jobs that upload
# coverage add id-token: write, the OIDC token Codecov accepts in place of a secret.
permissions:
  contents: read

# A pull request's newer push replaces its older run. On main every commit runs to the end, in a
# group of its own: a shared group keeps only one pending run, so a burst of merges would still drop
# the middle ones (docs/specs/016-platform/deployment.md "Runs on main are never cancelled").
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Parallel jobs, so a PR waits for the slowest one rather than the sum.
# None needs another: only the apps build, and nothing depends on an app.
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

  # The whole history, every run: a secret anywhere in it is public, whichever commit added it.
  # Known fake values are allowed in .gitleaks.toml (docs/specs/002-project-scope/secrets-policy.md).
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks version

      - name: Scan history for secrets
        run: ./gitleaks git --no-banner --redact --verbose .

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every workspace runs its suite exactly once. Those with test:coverage run
      # it in the coverage step, so plain `test` skips them; the filters come
      # from the manifests (scripts/ci-test-filters.mjs), not a list kept here.
      # Two packages at a time: each vitest already fills the runner's cores,
      # and turbo's default fan-out starved the CPU-heavy sticky-vision suite
      # into timeouts.
      - name: Test
        run: |
          set -euo pipefail
          node scripts/ci-test-filters.mjs | xargs pnpm turbo run test --concurrency=2

      # Coverage runs as its own step because it ENFORCES something: the
      # per-file 100% thresholds on the api worker's identity / token /
      # share-link modules (apps/api/vitest.config.ts). Without this step the
      # thresholds are a local-only opinion, and the coverage tooling itself
      # goes unexercised in CI — which is how a v4 coverage provider once sat
      # against a v5 runner with every check green.
      # The editor's suite is the one exception: it runs in the Editor unit tests jobs below.
      - name: Coverage thresholds
        run: pnpm turbo run test:coverage --concurrency=2 --filter=!@livedoc/live

      # Every workspace's lcov above, reported on Codecov; see the upload in Editor unit tests.
      # Codecov is a report, never a gate: a hung upload once ran the job into its timeout after every test
      # had passed, so the step has its own short budget and cannot fail the job.
      - name: Upload coverage
        timeout-minutes: 3
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: apps/*/coverage/lcov.info,packages/*/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false

  # The editor's suite (apps/live, about 800 files) is most of the repo's tests: on one 4-vCPU runner it
  # took 7 minutes. Split three ways, each job runs a third of its files under coverage, finishing
  # inside the Checks job's time (docs/specs/003-system-architecture/testing.md "Sizing the shards").
  # Codecov merges the thirds into one report; the editor holds no thresholds, so nothing needs the merge
  # to pass.
  editor-tests:
    name: Editor unit tests ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      # Every shard reports, so one failing shard never hides another's failures.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: >-
          pnpm --filter @livedoc/live exec vitest run --coverage
          --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # OIDC, so no Codecov secret; a pull request from a fork uploads tokenless instead. A Codecov
      # outage must not hold back a merge: the upload logs its error and the job still passes.
      # Codecov is a report, never a gate: a hung upload once ran the job into its timeout after every test
      # had passed, so the step has its own short budget and cannot fail the job.
      - name: Upload coverage
        timeout-minutes: 3
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: apps/live/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # The CLI package as npm would publish it (docs/specs/015-api/cli.md CLI3): its file list and size,
      # without publishing. `pnpm build` wrote apps/cli/dist.
      - name: CLI package dry run
        working-directory: apps/cli/dist
        run: npm pack --dry-run

      # Resolve the wrangler configs of the three workers that carry bindings
      # (api, mcp, router) without deploying anything, so a broken binding,
      # database or service name fails here rather than in a deploy.
      - name: Deploy config check
        run: pnpm deploy:check
