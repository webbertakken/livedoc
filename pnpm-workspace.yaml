packages:
  - 'apps/*'
  - 'packages/*'

autoInstallPeers: true
strictPeerDependencies: false

allowBuilds:
  esbuild: true
  workerd: true
  core-js: false
  onnxruntime-node: false
  protobufjs: false

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  # Already locked on main before pnpm's default one-day release age applied; pruned once the lockfile moves on.
  - parse5-parser-stream@8.1.1
  - parse5@8.1.1

overrides:
  'postcss': '^8.5.18'
  'undici': '^8.0.0'
  'js-yaml': '^5.0.0'
  'esbuild': '^0.28.1'
  'fast-uri': '^4.0.0'
  'qs': '^6.16.1'
  'body-parser@2': '^2.4.0'
  'ip-address@10': '^10.7.4'
  'vite': '^7.3.7'
  'nanoid': '^6.0.0'
  'vitest': '^5.0.5'
  '@hono/node-server': '^2.0.5'
  'ws': '^8.21.0'
  'sharp': '^0.35.5'
  'brace-expansion@1': '^1.1.16'
  'brace-expansion@2': '^2.1.2'
  'brace-expansion@3 || 4 || 5': '^5.0.8'
  'onnxruntime-node>global-agent': '^4.1.3'
  '@tensorflow/tfjs>argparse': '^3.0.0'
  'glob@9 || 10 || 11 || 12 || 13 || 14': '^14.0.4'
