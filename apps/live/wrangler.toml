name = "docs-nu-live"
main = "src/worker.ts"
compatibility_date = "2026-05-29"

# The worker fronts the static-export `./out` directory via an assets
# binding so it can rewrite `/document/<id>` paths onto the single
# placeholder build artefact (docs/specs/007-editor/new-document-route.md). Static export can't enumerate
# user-minted document ids at build time, so one HTML file backs every
# `/document/*` URL and the client reads the id from the pathname.
[assets]
directory = "./out"
binding = "ASSETS"
not_found_handling = "404-page"
# Assets are served BEFORE the worker by default, so without this the
# security headers in src/worker.ts (X-Frame-Options DENY et al.) only
# reached paths that matched no file: every real page, including the
# MCP OAuth consent screen, shipped frameable. Run the worker first for
# everything but the hashed /_next/ bundles, which need no page headers.
run_worker_first = ["/*", "!/_next/*"]

# The api, for the name a share link's preview shows (docs/specs/013-workspace/share-link-previews.md). Optional:
# without it the share page is served as built and previews show the brand card.
[[services]]
binding = "API"
service = "docs-nu-api"

# Workers Logs (docs/specs/016-platform/worker-logs.md): the worker's own log lines are kept in this Cloudflare
# account, so a failure nobody was tailing can still be read. Invocation logs stay off (they store each request's
# headers, address and location), and query strings are cut from the path every log line is stored with.
[observability]
enabled = true
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = false

# Workers Issues (docs/specs/016-platform/worker-issues.md): Cloudflare groups this worker's errors into issues, and an
# automation sends a new or returning one to the api's receiver. Wrangler 4.134 or later.
[observability.issues]
enabled = true
